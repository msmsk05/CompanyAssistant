<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Knowledge Copilot</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f5f7fa;
        }

        .header {
            background: #0078D4;
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 48px;
        }

        .header p {
            font-size: 24px;
            margin-top: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .1);
        }

        textarea {
            width: 100%;
            height: 140px;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: vertical;
            box-sizing: border-box;
        }

        button {
            background: #0078D4;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 24px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #106ebe;
        }

        .answer {
            margin-top: 20px;
            background: #f8f8f8;
            border-radius: 6px;
            padding: 15px;
            min-height: 120px;
            white-space: pre-wrap;
            border: 1px solid #ddd;
        }

        .sources {
            margin-top: 20px;
            background: #f8f8f8;
            border-radius: 6px;
            padding: 15px;
            min-height: 60px;
            border: 1px solid #ddd;
        }

        .examples {
            margin-top: 20px;
        }

        .example-btn {
            margin: 5px;
            background: #e6f2ff;
            color: #0078D4;
            border: 1px solid #0078D4;
        }

        .example-btn:hover {
            background: #d0e8ff;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Contoso Knowledge Copilot</h1>
        <p>Azure OpenAI + Azure AI Search + Azure AI Foundry</p>
    </div>

    <div class="container">

        <div class="card">

            <h2>Ask Contoso Copilot</h2>

            <p>
                Ask questions about HR policies, IT support, travel policies,
                employee handbooks, security guidance, and company knowledge.
            </p>

            <textarea id="question"
                placeholder="Example: How do I request a new laptop?"></textarea>

            <br><br>

            <button onclick="askCopilot()">
                Ask Copilot
            </button>

            <div class="examples">

                <button class="example-btn"
                    onclick="setQuestion('How do I request a new laptop?')">
                    Laptop Request
                </button>

                <button class="example-btn"
                    onclick="setQuestion('Summarize the employee handbook.')">
                    Employee Handbook
                </button>

                <button class="example-btn"
                    onclick="setQuestion('How do I reset MFA?')">
                    MFA Support
                </button>

                <button class="example-btn"
                    onclick="setQuestion('What documents discuss remote work?')">
                    Remote Work
                </button>

            </div>

            <h3>Answer</h3>

            <div id="answer" class="answer">
                Ask a question to begin.
            </div>

            <h3>Sources</h3>

            <div id="sources" class="sources">
                No sources yet.
            </div>

        </div>

    </div>

    <script>

        function setQuestion(text) {
            document.getElementById("question").value = text;
        }

        async function askCopilot() {

            const question =
                document.getElementById("question").value;

            if (!question) {
                alert("Please enter a question.");
                return;
            }

            document.getElementById("answer").innerText =
                "Thinking...";

            document.getElementById("sources").innerHTML =
                "";

            try {

                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: question
                    })
                });

                const data = await response.json();

                document.getElementById("answer").innerText =
                    data.answer || "No answer received.";

                if (data.sources &&
                    data.sources.length > 0) {

                    document.getElementById("sources").innerHTML =
                        data.sources
                            .map(source => `• ${source}`)
                            .join("<br>");

                } else {

                    document.getElementById("sources").innerText =
                        "No sources found.";

                }

            } catch (error) {

                document.getElementById("answer").innerText =
                    "Error: " + error.message;

                document.getElementById("sources").innerText =
                    "";

            }
        }

    </script>

</body>

</html>
